<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>实时成绩看板 - 按表格原序版</title>
<style>
  :root{
    --bg:#071226;
    --card:#0d1b2a;
    --card-border:rgba(255,255,255,0.08);
    --accent:#f4c94e;
    --ongoing:#2ecc71;
    --muted:#97a0b3;
    --font-sans: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;

    --design-width: 1920px;
    --design-height: 960px;
  }

  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--bg);color:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center; height:100vh;}
  #scaleWrap { transform-origin: center center; }

  .board-layout {
    width: var(--design-width);
    height: var(--design-height);
    box-sizing: border-box;
    padding: 24px 36px;
    display: grid;
    grid-template-columns: 370px 1fr 380px;
    gap: 28px;
    align-items: center;
  }

  /* 中间主看板 (联动 B2:E10) */
  .wrap{width:100%; box-sizing:border-box; padding:10px 16px; margin:0;}
  .project-eng{font-size:38px;font-weight:800;text-align:center;margin:6px 0;line-height:1.2}
  .project-chn{font-size:38px;text-align:center;margin:6px 0 14px 0;color:var(--muted)}

  .name-eng{font-size:42px;font-weight:800;text-align:center;margin:6px 0}
  .name-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .club{font-size:36px;text-align:center;margin:6px 0;color:var(--muted)}

  .labels-row{display:flex;gap:18px;justify-content:center;margin-top:18px}
  .label-card{background:var(--card);padding:12px;border-radius:8px;min-width:180px;text-align:center;border:1px solid var(--card-border)}
  .label-card .label{font-size:24px;color:var(--muted);margin-bottom:6px}
  .label-card .value{font-size:60px;font-weight:900}

  .final-wrap{text-align:center;margin-top:22px}
  .final-label{display:inline-block;background:var(--accent);color:#000;padding:10px 18px;border-radius:8px;font-weight:800;font-size:35px}
  .final-score{font-size:240px;font-weight:900;color:var(--accent);margin:-45px 0 10px 0;text-align:center;line-height:1.05}

  /* 左右侧边栏 */
  .side-panel {
    background: rgba(13, 27, 42, 0.55);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    height: 860px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .side-header {
    border-bottom: 2px solid rgba(244, 201, 78, 0.25);
    padding-bottom: 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .side-title-main {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .side-title-sub {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
  }

  .side-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
  }
  .side-list::-webkit-scrollbar { width: 4px; }
  .side-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .group-label {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 6px 12px;
    border-radius: 6px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .group-label:first-child { margin-top: 0; }
  .group-ongoing {
    background: rgba(46, 204, 113, 0.18);
    color: var(--ongoing);
    border-left: 4px solid var(--ongoing);
  }
  .group-beready {
    background: rgba(244, 201, 78, 0.18);
    color: var(--accent);
    border-left: 4px solid var(--accent);
    margin-top: 10px;
  }

  .athlete-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .badge-ongoing {
    background: var(--ongoing);
    color: #000;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-queue {
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .athlete-names {
    flex: 1;
    min-width: 0;
  }
  .athlete-names .n-eng {
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
  }
  .athlete-names .n-chn {
    font-size: 17px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    font-weight: 900;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-1 { background: #f4c94e; color: #000; box-shadow: 0 0 10px rgba(244,201,78,0.4); }
  .rank-2 { background: #d8dee9; color: #000; }
  .rank-3 { background: #d08770; color: #000; }

  .athlete-score {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .empty-tip {
    color: rgba(151, 160, 179, 0.45);
    text-align: center;
    margin-top: 80px;
    font-size: 18px;
  }

  #fullscreenBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background: rgba(13, 27, 42, 0.85);
    color: var(--accent);
    border: 1px solid rgba(244, 201, 78, 0.4);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.25s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #fullscreenBtn:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  body.is-fullscreen.idle #fullscreenBtn {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="scaleWrap">
    <div class="board-layout">

      <!-- 左栏：QUEUE (联动 J3:S12) -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">QUEUE</span>
          <span class="side-title-sub">场上与候场队列</span>
        </div>
        <div class="side-list" id="waitingList">
          <div class="empty-tip">正在同步数据...</div>
        </div>
      </div>

      <!-- 中间主看板 (联动 B2:E10) -->
      <div class="wrap">
        <div class="project-eng" id="projectEng">—</div>
        <div class="project-chn" id="projectCht">—</div>

        <div class="name-eng" id="nameEng">—</div>
        <div class="name-chn" id="nameCht">—</div>
        <div class="club" id="club">—</div>

        <div class="labels-row" id="labelsRow">
          <div class="label-card">
            <div class="label" id="labelA">A组得分</div>
            <div class="value" id="valA">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelB">B组得分</div>
            <div class="value" id="valB">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelD">纪律扣分</div>
            <div class="value" id="valD">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelF">裁判长扣分</div>
            <div class="value" id="valF">—</div>
          </div>
        </div>

        <div class="final-wrap">
          <div class="final-label" id="finalLabel">Final Score 最终得分</div>
        </div>
        <div class="final-score" id="finalScore">—</div>

        <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:8px">
          状态：<span id="updatedAt">正在连接 Google Sheet...</span>
        </div>
      </div>

      <!-- 右栏：RESULTS (精准联动右侧完赛成绩表：W/X/AB列，原序输出) -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">RESULTS</span>
          <span class="side-title-sub">已完成成绩排行</span>
        </div>
        <div class="side-list" id="completedList">
          <div class="empty-tip">暂无完赛成绩</div>
        </div>
      </div>

    </div>
  </div>

  <button id="fullscreenBtn" onclick="toggleFullScreen()" title="快捷键: F">
    <span>⛶</span> <span id="fsText">Full Screen</span>
  </button>

<script>
const SPREADSHEET_ID = "1gNxbOq4x3ltS62SC3wgOu3RfQLvPlsmacyR-Sb7Yvxc";
const SHEET_GID = "387691548";
const INTERVAL_MS = 3000;

// Google Sheets column indexes are zero-based in Google Visualization responses.
const COL = {
  number: 9,       // J: 号码
  order: 10,       // K: 出场次序
  project: 11,     // L: 比赛项目
  nameEng: 12,     // M: 英文姓名
  nameCht: 13,     // N: 中文姓名
  school: 14,      // O: 代表学校
  age: 15,         // P: 年龄
  score: 16,       // Q: 最终得分
  referee: 17,     // R: 裁判确认
  onStage: 18,     // S: 场上勾选
  resultRank: 20,  // U: 名次
  resultNumber: 21,// V: 号码
  resultProject: 22,// W: 比赛项目
  resultEng: 23,   // X: 英文姓名
  resultCht: 24,   // Y: 中文姓名
  resultSchool: 25,// Z: 代表学校
  resultAge: 26,   // AA: 年龄
  resultScore: 27, // AB: 最终得分
  resultReferee: 28// AC: 裁判确认
};

function safeCell(rows, r, c) {
  if (!Array.isArray(rows) || r < 0 || !rows[r] || !Array.isArray(rows[r].c)) return null;
  const cell = rows[r].c[c];
  if (!cell) return null;
  if (cell.v !== undefined && cell.v !== null && cell.v !== '') return cell.v;
  if (cell.f !== undefined && cell.f !== null && cell.f !== '') return cell.f;
  return null;
}

function textCell(value) {
  if (value === null || value === undefined) return '';
  return String(value).trim();
}

function formatScore(value) {
  if (value === null || value === undefined || value === '') return '—';
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(2) : String(value);
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

function isChecked(value) {
  if (value === true || value === 1) return true;
  const normalized = textCell(value).toLowerCase();
  return ['true', 'yes', 'y', '1', '✓', '✔', '是'].includes(normalized);
}

function setText(id, value, fallback = '—') {
  const element = document.getElementById(id);
  if (element) element.textContent = (value !== null && value !== undefined && textCell(value) !== '') ? String(value) : fallback;
}

function autoScale() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 960);
  document.getElementById('scaleWrap').style.transform = `scale(${scale})`;
}
autoScale();
window.addEventListener('resize', autoScale);

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    const request = document.documentElement.requestFullscreen;
    if (request) request.call(document.documentElement).catch(error => console.warn(error));
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  document.body.classList.toggle('is-fullscreen', isFs);
  setText('fsText', isFs ? 'Exit Full' : 'Full Screen');
  setTimeout(autoScale, 100);
});
document.addEventListener('keydown', event => {
  if (event.key === 'f' || event.key === 'F') toggleFullScreen();
});

let idleTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  if (document.fullscreenElement) {
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
});

function rowValue(rows, rowIndex, colIndex) {
  return textCell(safeCell(rows, rowIndex, colIndex));
}

function readQueue(rows) {
  const onStage = [];
  const waiting = [];
  // Row 3 is the heading; participant records normally begin on spreadsheet row 4.
  // Limit the queue to J:S rows 3–12, matching the sheet's displayed queue block.
  for (let r = 3; r <= Math.min(11, rows.length - 1); r++) {
    const item = {
      rowIndex: r,
      number: safeCell(rows, r, COL.number),
      order: safeCell(rows, r, COL.order),
      project: safeCell(rows, r, COL.project),
      nameEng: safeCell(rows, r, COL.nameEng),
      nameCht: safeCell(rows, r, COL.nameCht),
      school: safeCell(rows, r, COL.school),
      age: safeCell(rows, r, COL.age),
      score: safeCell(rows, r, COL.score),
      referee: safeCell(rows, r, COL.referee),
      onStage: isChecked(safeCell(rows, r, COL.onStage))
    };
    if (!textCell(item.nameEng) && !textCell(item.nameCht)) continue;
    (item.onStage ? onStage : waiting).push(item);
  }
  return { onStage, waiting };
}

function renderQueue(rows) {
  const container = document.getElementById('waitingList');
  const queue = readQueue(rows);
  const fragments = [];

  if (queue.onStage.length) {
    fragments.push(`<div class="group-label group-ongoing"><span>场上比赛</span><span>${queue.onStage.length} 人</span></div>`);
    queue.onStage.forEach(item => fragments.push(renderQueueCard(item, true)));
  }
  if (queue.waiting.length) {
    fragments.push(`<div class="group-label group-beready"><span>候场队列</span><span>${queue.waiting.length} 人</span></div>`);
    queue.waiting.forEach(item => fragments.push(renderQueueCard(item, false)));
  }
  container.innerHTML = fragments.length ? fragments.join('') : '<div class="empty-tip">暂无场上或候场选手</div>';
  return queue;
}

function renderQueueCard(item, isOnStage) {
  const displayRank = textCell(item.order) || textCell(item.number) || '—';
  const nameEng = textCell(item.nameEng) || textCell(item.nameCht) || `号码 ${textCell(item.number)}`;
  const subline = [textCell(item.nameCht), textCell(item.project)].filter(Boolean).join(' · ');
  const school = textCell(item.school);
  return `<div class="athlete-item">
    <div class="rank-badge">${escapeHtml(displayRank)}</div>
    <div class="athlete-names">
      <div class="n-eng">${escapeHtml(nameEng)}</div>
      <div class="n-chn">${escapeHtml(subline || school || ' ')}</div>
    </div>
    <span class="${isOnStage ? 'badge-ongoing' : 'badge-queue'}">${isOnStage ? '场上' : '候场'}</span>
  </div>`;
}

function readCompletedResults(rows) {
  const results = [];
  // U:AC is the spreadsheet's prepared "同项目完赛成绩" table.
  // Display this table as-is: do not re-filter it using the queue, because the sheet
  // already determines which project's completed results belong in this area.
  for (let r = 3; r < rows.length; r++) {
    const result = {
      rank: safeCell(rows, r, COL.resultRank),
      number: safeCell(rows, r, COL.resultNumber),
      project: safeCell(rows, r, COL.resultProject),
      nameEng: safeCell(rows, r, COL.resultEng),
      nameCht: safeCell(rows, r, COL.resultCht),
      school: safeCell(rows, r, COL.resultSchool),
      age: safeCell(rows, r, COL.resultAge),
      score: safeCell(rows, r, COL.resultScore),
      referee: safeCell(rows, r, COL.resultReferee)
    };
    const hasIdentity = [result.number, result.project, result.nameEng, result.nameCht]
      .some(value => textCell(value) !== '');
    const hasScore = result.score !== null && result.score !== undefined && textCell(result.score) !== '';
    if (hasIdentity && hasScore) results.push(result);
  }
  return results;
}

function renderCompleted(rows) {
  const container = document.getElementById('completedList');
  const results = readCompletedResults(rows);
  if (!results.length) {
    container.innerHTML = '<div class="empty-tip">暂无完赛成绩</div>';
    return 0;
  }

  container.innerHTML = results.map((item, index) => {
    const rank = textCell(item.rank) || String(index + 1);
    const mainName = textCell(item.nameEng) || textCell(item.nameCht) || `号码 ${textCell(item.number)}`;
    const lineTwo = [textCell(item.nameCht), textCell(item.project)].filter(Boolean).join(' · ');
    const lineThree = [
      textCell(item.number) ? `号码 ${textCell(item.number)}` : '',
      textCell(item.school),
      textCell(item.age) ? `${textCell(item.age)}岁` : ''
    ].filter(Boolean).join(' · ');
    const rankClass = rank === '1' ? 'rank-1' : rank === '2' ? 'rank-2' : rank === '3' ? 'rank-3' : '';
    return `<div class="athlete-item">
      <div class="rank-badge ${rankClass}">${escapeHtml(rank)}</div>
      <div class="athlete-names">
        <div class="n-eng">${escapeHtml(mainName)}</div>
        <div class="n-chn">${escapeHtml(lineTwo || lineThree || ' ')}</div>
        ${lineThree && lineTwo ? `<div class="n-chn">${escapeHtml(lineThree)}</div>` : ''}
      </div>
      <div class="athlete-score">${escapeHtml(formatScore(item.score))}</div>
    </div>`;
  }).join('');
  return results.length;
}

// Read label/value pairs from B2:E10 if the operator's sheet has them.
// If labels are absent, the center panel falls back to the first on-stage athlete.
function findLabeledValue(rows, labelPattern) {
  for (let r = 1; r <= Math.min(9, rows.length - 1); r++) {
    for (let c = 1; c <= 4; c++) {
      const label = rowValue(rows, r, c);
      if (!label || !labelPattern.test(label)) continue;
      for (let nextCol = c + 1; nextCol <= 4; nextCol++) {
        const value = safeCell(rows, r, nextCol);
        if (value !== null && textCell(value) !== '') return value;
      }
      for (let nextRow = r + 1; nextRow <= Math.min(9, rows.length - 1); nextRow++) {
        const value = safeCell(rows, nextRow, c);
        if (value !== null && textCell(value) !== '') return value;
      }
    }
  }
  return null;
}

function renderMainBoard(rows, queue) {
  const current = queue.onStage[0] || queue.waiting[0] || null;
  const eventEn = findLabeledValue(rows, /英文项目|项目英文|英文比赛项目|english.*(event|project)|event.*english/i);
  const eventZh = findLabeledValue(rows, /中文项目|项目中文|比赛项目|项目名称|赛事项目|chinese.*(event|project)|event.*chinese/i);
  const athleteEn = findLabeledValue(rows, /英文姓名|英文名|姓名英文|选手英文|运动员英文|english.*name|name.*english/i);
  const athleteZh = findLabeledValue(rows, /中文姓名|中文名|姓名中文|选手中文|运动员中文|chinese.*name|name.*chinese/i);
  const school = findLabeledValue(rows, /代表学校|学校名称|学校|school|club/i);
  const age = findLabeledValue(rows, /年龄|\bage\b/i);
  const finalScore = findLabeledValue(rows, /最终得分|最终成绩|总分|final.*score|total.*score/i);

  setText('projectEng', eventEn || 'EVENT');
  setText('projectCht', eventZh || (current && current.project) || '—');
  setText('nameEng', athleteEn || (current && current.nameEng) || '—');
  setText('nameCht', athleteZh || (current && current.nameCht) || '—');
  setText('club', school || (current && current.school) || '—');
  setText('finalScore', formatScore(finalScore !== null ? finalScore : (current ? current.score : null)));

  // Update breakdown values only when the B2:E10 block contains matching labels.
  const breakdown = [
    ['valA', /A组得分|A组评分|A分|\bA\s*score\b/i],
    ['valB', /B组得分|B组评分|B分|\bB\s*score\b/i],
    ['valD', /纪律扣分|纪律分|纪律扣/i],
    ['valF', /裁判长扣分|裁判长扣|主裁扣分/i]
  ];
  breakdown.forEach(([id, pattern]) => {
    const value = findLabeledValue(rows, pattern);
    setText(id, value === null ? '—' : formatScore(value));
  });
  if (age !== null) {
    const clubElement = document.getElementById('club');
    if (clubElement && textCell(age)) clubElement.textContent = `${textCell(school || (current && current.school) || '')}${textCell(school || (current && current.school) || '') ? ' · ' : ''}${textCell(age)}岁`;
  }
}

function parseGoogleVisualizationResponse(rawText) {
  const firstBrace = rawText.indexOf('{');
  const lastBrace = rawText.lastIndexOf('}');
  if (firstBrace < 0 || lastBrace <= firstBrace) {
    throw new Error('Google Sheets 没有返回可识别的数据。请检查工作表分享权限。');
  }
  const payload = JSON.parse(rawText.slice(firstBrace, lastBrace + 1));
  if (payload.status && payload.status !== 'ok') {
    const message = payload.errors && payload.errors.length ? payload.errors.map(error => error.detailed_message || error.message).join('; ') : payload.status;
    throw new Error(message || 'Google Sheets 查询失败');
  }
  if (!payload.table || !Array.isArray(payload.table.rows)) {
    throw new Error('返回的数据格式不正确。');
  }
  return payload.table.rows;
}

let isFetching = false;
async function syncSheet() {
  if (isFetching) return;
  isFetching = true;
  const status = document.getElementById('updatedAt');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${SHEET_GID}&headers=0&tqx=out:json&_=${Date.now()}`;
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const rawText = await response.text();
    const rows = parseGoogleVisualizationResponse(rawText);
    const queue = renderQueue(rows);
    const resultCount = renderCompleted(rows);
    renderMainBoard(rows, queue);
    status.textContent = `同步成功 ${new Date().toLocaleTimeString()} · 完赛成绩 ${resultCount} 条`;
  } catch (error) {
    console.error('Google Sheets 同步失败：', error);
    status.textContent = `同步失败：${error.message || '请检查网络及表格分享权限'}`;
    const completedList = document.getElementById('completedList');
    if (completedList && !completedList.dataset.hasRendered) {
      completedList.innerHTML = '<div class="empty-tip">读取失败：请确认表格已允许通过链接查看</div>';
    }
  } finally {
    isFetching = false;
  }
}

// Mark the results list after a successful render so a transient network error
// does not erase the last known good data.
const originalRenderCompleted = renderCompleted;
renderCompleted = function(rows) {
  const count = originalRenderCompleted(rows);
  const element = document.getElementById('completedList');
  if (element) element.dataset.hasRendered = 'true';
  return count;
};

syncSheet();
setInterval(syncSheet, INTERVAL_MS);

</script>
