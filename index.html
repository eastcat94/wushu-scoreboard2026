<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>实时成绩看板 - 终极适配版</title>
<style>
  :root{
    --bg:#071226;
    --card:#0d1b2a;
    --card-border:rgba(255,255,255,0.08);
    --accent:#f4c94e;
    --ongoing:#2ecc71;
    --muted:#97a0b3;
    --font-sans: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;

    --design-width: 1920px;
    --design-height: 960px;
  }

  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--bg);color:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center; height:100vh;}
  #scaleWrap { transform-origin: center center; }

  .board-layout {
    width: var(--design-width);
    height: var(--design-height);
    box-sizing: border-box;
    padding: 24px 36px;
    display: grid;
    grid-template-columns: 370px 1fr 380px;
    gap: 28px;
    align-items: center;
  }

  /* 中间主看板 */
  .wrap{width:100%; box-sizing:border-box; padding:10px 16px; margin:0;}
  .project-eng{font-size:38px;font-weight:800;text-align:center;margin:6px 0;line-height:1.2}
  .project-chn{font-size:38px;text-align:center;margin:6px 0 14px 0;color:var(--muted)}

  #singleView { display: block; }
  .name-eng{font-size:42px;font-weight:800;text-align:center;margin:6px 0}
  .name-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .club{font-size:36px;text-align:center;margin:6px 0;color:var(--muted)}

  .labels-row{display:flex;gap:18px;justify-content:center;margin-top:18px}
  .label-card{background:var(--card);padding:12px;border-radius:8px;min-width:180px;text-align:center;border:1px solid var(--card-border)}
  .label-card .label{font-size:24px;color:var(--muted);margin-bottom:6px}
  .label-card .value{font-size:60px;font-weight:900}

  .final-wrap{text-align:center;margin-top:22px}
  .final-label{display:inline-block;background:var(--accent);color:#000;padding:10px 18px;border-radius:8px;font-weight:800;font-size:35px}
  .final-score{font-size:240px;font-weight:900;color:var(--accent);margin:-45px 0 10px 0;text-align:center;line-height:1.05}

  #multiView {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 10px;
  }
  #multiView.layout-3 {
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .multi-card {
    background: rgba(13, 27, 42, 0.75);
    border: 2px solid rgba(244, 201, 78, 0.35);
    border-radius: 16px;
    padding: 18px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .multi-tag {
    display: inline-block;
    align-self: center;
    background: rgba(46, 204, 113, 0.2);
    color: var(--ongoing);
    border: 1px solid var(--ongoing);
    font-size: 14px;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .multi-name-eng { font-size: 26px; font-weight: 800; color: #fff; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .multi-name-chn { font-size: 24px; color: var(--muted); margin: 2px 0; }
  .multi-club { font-size: 18px; color: var(--muted); margin: 2px 0 10px 0; min-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .multi-subscores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .multi-subcard {
    background: var(--bg);
    padding: 6px 2px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
  }
  .multi-subcard .label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .multi-subcard .value { font-size: 22px; font-weight: 900; color: #fff; }

  .multi-final-label {
    display: inline-block;
    align-self: center;
    background: var(--accent);
    color: #000;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .multi-final-score {
    font-size: 95px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin: 4px 0;
    font-variant-numeric: tabular-nums;
  }

  /* 左右侧边栏 */
  .side-panel {
    background: rgba(13, 27, 42, 0.55);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    height: 860px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .side-header {
    border-bottom: 2px solid rgba(244, 201, 78, 0.25);
    padding-bottom: 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .side-title-main {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .side-title-sub {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
  }

  .side-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
  }
  .side-list::-webkit-scrollbar { width: 4px; }
  .side-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .group-label {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 6px 12px;
    border-radius: 6px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .group-label:first-child { margin-top: 0; }
  .group-ongoing {
    background: rgba(46, 204, 113, 0.18);
    color: var(--ongoing);
    border-left: 4px solid var(--ongoing);
  }
  .group-beready {
    background: rgba(244, 201, 78, 0.18);
    color: var(--accent);
    border-left: 4px solid var(--accent);
    margin-top: 10px;
  }

  .athlete-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .athlete-item.ongoing-highlight {
    border-color: var(--ongoing);
    background: linear-gradient(90deg, rgba(46, 204, 113, 0.14) 0%, rgba(13, 27, 42, 0.95) 100%);
    box-shadow: 0 4px 14px rgba(46, 204, 113, 0.12);
  }

  .athlete-item.be-ready-highlight {
    border-color: var(--accent);
    background: linear-gradient(90deg, rgba(244, 201, 78, 0.14) 0%, rgba(13, 27, 42, 0.95) 100%);
    box-shadow: 0 4px 14px rgba(244, 201, 78, 0.1);
  }

  .badge-ongoing {
    background: var(--ongoing);
    color: #000;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-ready {
    background: var(--accent);
    color: #000;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-queue {
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .athlete-names {
    flex: 1;
    min-width: 0;
  }
  .athlete-names .n-eng {
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
  }
  .athlete-names .n-chn {
    font-size: 17px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    font-weight: 900;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-1 { background: #f4c94e; color: #000; box-shadow: 0 0 10px rgba(244,201,78,0.4); }
  .rank-2 { background: #d8dee9; color: #000; }
  .rank-3 { background: #d08770; color: #000; }

  .athlete-score {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .empty-tip {
    color: rgba(151, 160, 179, 0.45);
    text-align: center;
    margin-top: 80px;
    font-size: 18px;
  }

  #fullscreenBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background: rgba(13, 27, 42, 0.85);
    color: var(--accent);
    border: 1px solid rgba(244, 201, 78, 0.4);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.25s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #fullscreenBtn:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  body.is-fullscreen.idle #fullscreenBtn {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="scaleWrap">
    <div class="board-layout">

      <!-- 左栏：队列 -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">QUEUE</span>
          <span class="side-title-sub">场上与候场队列</span>
        </div>
        <div class="side-list" id="waitingList">
          <div class="empty-tip">正在同步数据...</div>
        </div>
      </div>

      <!-- 中间主看板 -->
      <div class="wrap">
        <div class="project-eng" id="projectEng">—</div>
        <div class="project-chn" id="projectCht">—</div>

        <div id="singleView">
          <div class="name-eng" id="nameEng">—</div>
          <div class="name-chn" id="nameCht">—</div>
          <div class="club" id="club">—</div>

          <div class="labels-row" id="labelsRow">
            <div class="label-card">
              <div class="label" id="labelA">A组得分</div>
              <div class="value" id="valA">—</div>
            </div>
            <div class="label-card">
              <div class="label" id="labelB">B组得分</div>
              <div class="value" id="valB">—</div>
            </div>
            <div class="label-card">
              <div class="label" id="labelD">纪律扣分</div>
              <div class="value" id="valD">—</div>
            </div>
            <div class="label-card">
              <div class="label" id="labelF">裁判长扣分</div>
              <div class="value" id="valF">—</div>
            </div>
          </div>

          <div class="final-wrap">
            <div class="final-label" id="finalLabel">Final Score 最终得分</div>
          </div>
          <div class="final-score" id="finalScore">—</div>
        </div>

        <div id="multiView"></div>

        <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:8px">
          状态：<span id="updatedAt">正在连接 Google Sheet...</span>
        </div>
      </div>

      <!-- 右栏：已完成排行 -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">RESULTS</span>
          <span class="side-title-sub">已完成成绩排行</span>
        </div>
        <div class="side-list" id="completedList">
          <div class="empty-tip">暂无完赛成绩</div>
        </div>
      </div>

    </div>
  </div>

  <button id="fullscreenBtn" onclick="toggleFullScreen()" title="快捷键: F">
    <span>⛶</span> <span id="fsText">全屏 Fullscreen</span>
  </button>

<script>
const SPREADSHEET_ID = "1gNxbOq4x3ltS62SC3wgOu3RfQLvPlsmacyR-Sb7Yvxc";
const SHEET_NAME = "score";
const INTERVAL_MS = 3000;
const FIX_BASE_COL = 1;

let rememberedProject = "";
const completedMemory = new Map();

function safeCell(rows, r, c){
  if (!rows || r < 0 || !rows[r] || !rows[r].c) return null;
  const cell = rows[r].c[c];
  if (!cell) return null;
  if (cell.v !== undefined && cell.v !== null && cell.v !== '') return cell.v;
  if (cell.f !== undefined && cell.f !== null && cell.f !== '') return cell.f;
  return null;
}

function formatScore(v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n.toFixed(2);
}

function escapeHtml(str){
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function autoScale() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 960);
  document.getElementById("scaleWrap").style.transform = `scale(${scale})`;
}
autoScale();
window.addEventListener('resize', autoScale);

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(e => console.warn(e));
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  document.body.classList.toggle('is-fullscreen', isFs);
  document.getElementById('fsText').innerText = isFs ? '退出全屏 Exit' : '全屏 Fullscreen';
  setTimeout(autoScale, 100);
});
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFullScreen();
});

let idleTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  if (document.fullscreenElement) {
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
});

function processQueueAndRender(rows, offset, currentProjCht, ongoingNames, currentAthleteIdRaw, targetCount) {
  if (currentProjCht && currentProjCht !== '—' && currentProjCht !== rememberedProject) {
    rememberedProject = currentProjCht;
    completedMemory.clear();
  }

  const queueList = [];

  for (let r = 0; r < rows.length; r++) {
    const athleteId = safeCell(rows, r, 9);
    const orderNum  = safeCell(rows, r, 10);
    const projCht   = safeCell(rows, r, 11);
    const nameEng   = safeCell(rows, r, 12);
    const nameCht   = safeCell(rows, r, 13);
    const clubName  = safeCell(rows, r, 14);
    const rawScore  = safeCell(rows, r, 16);
    const confirmed = safeCell(rows, r, 17);

    if (!nameEng && !nameCht) continue;
    if (String(projCht || '').includes('比赛项目') || String(athleteId || '').includes('号码')) continue;

    if (currentProjCht && currentProjCht !== '—' && projCht && String(projCht).trim() !== String(currentProjCht).trim()) {
      continue;
    }

    const numScore = Number(rawScore);
    // 只要 Q列有数值（数字，包括负数和0），或者 R列已确认，就判定为已出分/完赛
    const hasScore = (rawScore !== null && rawScore !== undefined && rawScore !== '' && !isNaN(numScore));
    const isConfirmed = (confirmed === true || String(confirmed).toUpperCase() === 'TRUE' || String(confirmed).toLowerCase() === 'yes' || hasScore);

    queueList.push({
      athleteId,
      orderNum,
      nameEng: nameEng || '—',
      nameCht: nameCht || '—',
      club: clubName || '—',
      score: isNaN(numScore) ? 0 : numScore,
      scoreText: formatScore(rawScore),
      hasScore,
      isConfirmed
    });
  }

  const waitingAthletes = [];

  queueList.forEach((item) => {
    // 检查是否为当前正在场上比赛的选手
    const isOngoing = ongoingNames.some(ogName => ogName && item.nameEng.trim().toLowerCase() === ogName.trim().toLowerCase());

    if (isOngoing) {
      return; // 正在比赛的选手不进入左侧队列
    }

    // 智能完赛判定：只要已经出分（hasScore）或裁判确认（isConfirmed），坚决移入右侧 RESULTS 排行榜
    if (item.hasScore || item.isConfirmed) {
      completedMemory.set(item.nameEng + '|' + item.nameCht, {
        nameEng: item.nameEng,
        nameCht: item.nameCht,
        score: item.score,
        scoreText: item.scoreText
      });
    } else {
      waitingAthletes.push(item);
    }
  });

  // 渲染左侧栏 (QUEUE)
  const waitingEl = document.getElementById('waitingList');
  let leftHtml = '';

  if (ongoingNames.length > 0 && ongoingNames[0] !== '—') {
    leftHtml += `<div class="group-label group-ongoing"><span>● ON GOING</span><span>正在比赛</span></div>`;
    ongoingNames.forEach((ogName) => {
      if (ogName && ogName !== '—') {
        leftHtml += `
          <div class="athlete-item ongoing-highlight">
            <span class="badge-ongoing">ON GOING</span>
            <div class="athlete-names">
              <div class="n-eng">${escapeHtml(ogName)}</div>
            </div>
          </div>
        `;
      }
    });
  }

  if (waitingAthletes.length > 0) {
    leftHtml += `<div class="group-label group-beready"><span>⏳ BE READY</span><span>准备上场</span></div>`;
    waitingAthletes.forEach((item, idx) => {
      leftHtml += `
        <div class="athlete-item ${idx === 0 ? 'be-ready-highlight' : ''}">
          <span class="${idx === 0 ? 'badge-ready' : 'badge-queue'}">
            ${idx === 0 ? 'BE READY' : '#' + (item.orderNum !== null ? escapeHtml(item.orderNum) : (idx + 1))}
          </span>
          <div class="athlete-names">
            <div class="n-eng">${escapeHtml(item.nameEng)}</div>
            <div class="n-chn">${escapeHtml(item.nameCht)}</div>
          </div>
        </div>
      `;
    });
  }

  waitingEl.innerHTML = leftHtml || '<div class="empty-tip">暂无候场选手</div>';

  // 渲染右侧栏 (RESULTS)
  const completedArr = Array.from(completedMemory.values());
  completedArr.sort((a, b) => b.score - a.score);

  const completedEl = document.getElementById('completedList');
  if (completedArr.length === 0) {
    completedEl.innerHTML = '<div class="empty-tip">暂无完赛成绩</div>';
  } else {
    completedEl.innerHTML = completedArr.map((item, idx) => {
      const rank = idx + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      return `
        <div class="athlete-item">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <div class="athlete-names">
            <div class="n-eng">${escapeHtml(item.nameEng)}</div>
            <div class="n-chn">${escapeHtml(item.nameCht)}</div>
          </div>
          <div class="athlete-score">${escapeHtml(item.scoreText)}</div>
        </div>
      `;
    }).join('');
  }
}

/* JSONP 回调接收数据 */
window.handleGvizResponse = function(data) {
  if (!data || data.status === 'error' || !data.table || !data.table.rows) {
    document.getElementById('updatedAt').innerText = '读取异常';
    return;
  }

  const rows = data.table.rows;
  const baseCol = FIX_BASE_COL;

  let offset = 0;
  if (!safeCell(rows, 0, baseCol) && safeCell(rows, 1, baseCol)) {
    offset = 1;
  }

  const projectEng = safeCell(rows, 0 + offset, baseCol) || '—';
  const projectCht = safeCell(rows, 1 + offset, baseCol) || '—';

  const p1Data = {
    nameEng:    safeCell(rows, 2 + offset, baseCol) || '—',
    nameCht:    safeCell(rows, 3 + offset, baseCol) || '—',
    club:       safeCell(rows, 4 + offset, baseCol) || '—',
    valA:       formatScore(safeCell(rows, 6 + offset, baseCol)),
    valB:       formatScore(safeCell(rows, 6 + offset, baseCol+1)),
    valD:       formatScore(safeCell(rows, 6 + offset, baseCol+2)),
    valF:       formatScore(safeCell(rows, 6 + offset, baseCol+3)),
    finalScore: formatScore(safeCell(rows, 8 + offset, baseCol))
  };

  let currentAthleteId = safeCell(rows, 2 + offset, 5);
  for (let r = 0; r < Math.min(rows.length, 6); r++) {
    if (String(safeCell(rows, r, 6) || '').includes('选手编号')) {
      currentAthleteId = safeCell(rows, r, 5);
      break;
    }
  }

  // 自动检测表格 H2 单元格（行 offset+1, 列 7 即 H列）作为多人模式开关（1=单人, 2=双人, 3=三人）
  const sheetModeVal = Number(safeCell(rows, 1 + offset, 7)) || 1;
  const hasSlash = /[\/,&+，、]/.test(String(currentAthleteId || ''));
  
  let targetCount = 1;
  if (sheetModeVal >= 2 && sheetModeVal <= 3) {
    targetCount = sheetModeVal;
  } else if (hasSlash) {
    targetCount = String(currentAthleteId).split(/[\/,&+，、\s]+/).length;
  }

  document.getElementById('projectEng').innerText = projectEng;
  document.getElementById('projectCht').innerText = projectCht;

  const singleView = document.getElementById('singleView');
  const multiView = document.getElementById('multiView');

  const ongoingNames = [p1Data.nameEng];

  if (targetCount <= 1) {
    singleView.style.display = 'block';
    multiView.style.display = 'none';

    document.getElementById('nameEng').innerText    = p1Data.nameEng;
    document.getElementById('nameCht').innerText    = p1Data.nameCht;
    document.getElementById('club').innerText       = p1Data.club;
    document.getElementById('valA').innerText       = p1Data.valA;
    document.getElementById('valB').innerText       = p1Data.valB;
    document.getElementById('valD').innerText       = p1Data.valD;
    document.getElementById('valF').innerText       = p1Data.valF;
    document.getElementById('finalScore').innerText = p1Data.finalScore;
  } else {
    singleView.style.display = 'none';
    multiView.style.display = 'grid';
    multiView.className = targetCount === 3 ? 'layout-3' : '';

    const idParts = String(currentAthleteId || '').split(/[\/,&+，、\s]+/).map(s => s.trim()).filter(Boolean);
    const multiCards = [ { ...p1Data, tagNum: 1 } ];

    for (let i = 1; i < targetCount; i++) {
      const explicitId = idParts[i] || null;
      let found = null;
      for (let r = 0; r < rows.length; r++) {
        const aid = safeCell(rows, r, 9);
        if (explicitId && aid && String(aid).trim() === explicitId) {
          found = {
            nameEng: safeCell(rows, r, 12) || '—',
            nameCht: safeCell(rows, r, 13) || '—',
            club:    safeCell(rows, r, 14) || '—',
            finalScore: formatScore(safeCell(rows, r, 16))
          };
          break;
        }
      }
      if (!found) {
        found = { nameEng: `选手 ${i+1}`, nameCht: '—', club: '—', finalScore: '—' };
      }
      ongoingNames.push(found.nameEng);
      multiCards.push({ ...found, valA:'—', valB:'—', valD:'—', valF:'—', tagNum: i+1 });
    }

    multiView.innerHTML = multiCards.map((athlete) => `
      <div class="multi-card">
        <div>
          <div class="multi-tag">ON GOING · 选手 ${athlete.tagNum}</div>
          <div class="multi-name-eng">${escapeHtml(athlete.nameEng)}</div>
          <div class="multi-name-chn">${escapeHtml(athlete.nameCht)}</div>
          <div class="multi-club">${escapeHtml(athlete.club)}</div>
          <div class="multi-subscores">
            <div class="multi-subcard"><div class="label">A组</div><div class="value">${athlete.tagNum === 1 ? p1Data.valA : '—'}</div></div>
            <div class="multi-subcard"><div class="label">B组</div><div class="value">${athlete.tagNum === 1 ? p1Data.valB : '—'}</div></div>
            <div class="multi-subcard"><div class="label">纪律</div><div class="value">${athlete.tagNum === 1 ? p1Data.valD : '—'}</div></div>
            <div class="multi-subcard"><div class="label">裁判长</div><div class="value">${athlete.tagNum === 1 ? p1Data.valF : '—'}</div></div>
          </div>
        </div>
        <div>
          <div class="multi-final-label">Final Score 最终得分</div>
          <div class="multi-final-score">${escapeHtml(athlete.finalScore)}</div>
        </div>
      </div>
    `).join('');
  }

  processQueueAndRender(rows, offset, projectCht, ongoingNames, currentAthleteId, targetCount);
  document.getElementById('updatedAt').innerText = '已同步 ' + new Date().toLocaleTimeString();
};

function fetchAndRender() {
  const oldScript = document.getElementById('gvizScript');
  if (oldScript) oldScript.remove();

  const script = document.createElement('script');
  script.id = 'gvizScript';
  script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleGvizResponse&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
  document.body.appendChild(script);
}

fetchAndRender();
setInterval(fetchAndRender, INTERVAL_MS);
</script>
</body>
</html>
