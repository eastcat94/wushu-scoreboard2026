<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>实时成绩看板 - 扩展三栏版</title>
<style>
  :root{
    --bg:#071226;
    --card:#0d1b2a;
    --card-border:rgba(255,255,255,0.07);
    --accent:#f4c94e;
    --muted:#97a0b3;
    --font-sans: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    --design-width: 1920px;
    --design-height: 960px;
  }

  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--bg);color:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center; height:100vh;}
  #scaleWrap { transform-origin: center center; }

  .board-layout {
    width: var(--design-width);
    height: var(--design-height);
    box-sizing: border-box;
    padding: 24px 36px;
    display: grid;
    grid-template-columns: 360px 1fr 380px;
    gap: 28px;
    align-items: center;
  }

  .wrap{width:100%; box-sizing:border-box; padding:10px 22px; margin:0;}
  .project-eng{font-size:40px;font-weight:800;text-align:center;margin:8px 0}
  .project-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .name-eng{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
  .name-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .club{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}

  .labels-row{display:flex;gap:18px;justify-content:center;margin-top:18px}
  .label-card{background:var(--card);padding:12px;border-radius:8px;min-width:180px;text-align:center}
  .label-card .label{font-size:24px;color:var(--muted);margin-bottom:6px}
  .label-card .value{font-size:60px;font-weight:900}

  .final-wrap{text-align:center;margin-top:22px}
  .final-label{display:inline-block;background:var(--accent);color:#000;padding:10px 18px;border-radius:8px;font-weight:800;font-size:35px}
  .final-score{font-size:250px;font-weight:900;color:var(--accent);margin:-50px 0 14px 0;text-align:center}

  .side-panel {
    background: rgba(13, 27, 42, 0.55);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    height: 860px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .side-header {
    border-bottom: 2px solid rgba(244, 201, 78, 0.25);
    padding-bottom: 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .side-title-main { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
  .side-title-sub { font-size: 15px; color: var(--muted); font-weight: 600; }

  .side-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
  }
  .side-list::-webkit-scrollbar { width: 4px; }
  .side-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .athlete-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .athlete-item.be-ready-highlight {
    border-color: var(--accent);
    background: linear-gradient(90deg, rgba(244, 201, 78, 0.14) 0%, rgba(13, 27, 42, 0.95) 100%);
    box-shadow: 0 4px 16px rgba(244, 201, 78, 0.12);
  }

  .badge-ready {
    background: var(--accent); color: #000; font-size: 13px; font-weight: 900;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-queue {
    background: rgba(255, 255, 255, 0.08); color: var(--muted); font-size: 13px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
  }

  .athlete-names { flex: 1; min-width: 0; }
  .athlete-names .n-eng {
    font-size: 20px; font-weight: 800; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25;
  }
  .athlete-names .n-chn {
    font-size: 18px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .rank-badge {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: var(--muted);
    font-weight: 900; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .rank-1 { background: #f4c94e; color: #000; box-shadow: 0 0 10px rgba(244,201,78,0.4); }
  .rank-2 { background: #d8dee9; color: #000; }
  .rank-3 { background: #d08770; color: #000; }

  .athlete-score {
    font-size: 28px; font-weight: 900; color: var(--accent);
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }

  .empty-tip { color: rgba(151, 160, 179, 0.45); text-align: center; margin-top: 80px; font-size: 18px; }

  #fullscreenBtn {
    position: fixed; bottom: 20px; right: 20px; z-index: 9999;
    background: rgba(13, 27, 42, 0.85); color: var(--accent);
    border: 1px solid rgba(244, 201, 78, 0.4); border-radius: 8px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
    opacity: 0.35; transition: opacity 0.25s ease, transform 0.2s ease;
    display: flex; align-items: center; gap: 6px;
  }
  #fullscreenBtn:hover { opacity: 1; background: rgba(244, 201, 78, 0.15); transform: translateY(-2px); }
  body.is-fullscreen.idle #fullscreenBtn { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="scaleWrap">
    <div class="board-layout">

      <!-- 左侧栏：等待出场 (Be Ready) -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">BE READY</span>
          <span class="side-title-sub">等待出场</span>
        </div>
        <div class="side-list" id="waitingList">
          <div class="empty-tip">暂无候场选手</div>
        </div>
      </div>

      <!-- 中间栏：实时成绩看板主体 -->
      <div class="wrap">
        <div class="project-eng" id="projectEng">—</div>
        <div class="project-chn" id="projectCht">—</div>
        <div class="name-eng" id="nameEng">—</div>
        <div class="name-chn" id="nameCht">—</div>
        <div class="club" id="club">—</div>

        <div class="labels-row" id="labelsRow" style="margin-top:18px">
          <div class="label-card">
            <div class="label" id="labelA">A组得分</div>
            <div class="value" id="valA">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelB">B组得分</div>
            <div class="value" id="valB">—</div>
          </div>
          <div class="label-card">
