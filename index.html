<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>实时成绩看板 - 智能对齐版</title>
<style>
  :root{
    --bg:#071226;
    --card:#0d1b2a;
    --card-border:rgba(255,255,255,0.08);
    --accent:#f4c94e;
    --muted:#97a0b3;
    --font-sans: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;

    --design-width: 1920px;
    --design-height: 960px;
  }

  html,body{height:100%;margin:0;font-family:var(--font-sans);background:var(--bg);color:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center; height:100vh;}
  #scaleWrap { transform-origin: center center; }

  .board-layout {
    width: var(--design-width);
    height: var(--design-height);
    box-sizing: border-box;
    padding: 24px 36px;
    display: grid;
    grid-template-columns: 360px 1fr 380px;
    gap: 28px;
    align-items: center;
  }

  /* 中间主看板 */
  .wrap{width:100%; box-sizing:border-box; padding:10px 22px; margin:0;}
  .project-eng{font-size:40px;font-weight:800;text-align:center;margin:8px 0}
  .project-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .name-eng{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
  .name-chn{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}
  .club{font-size:40px;text-align:center;margin:6px 0;color:var(--muted)}

  .labels-row{display:flex;gap:18px;justify-content:center;margin-top:18px}
  .label-card{background:var(--card);padding:12px;border-radius:8px;min-width:180px;text-align:center}
  .label-card .label{font-size:24px;color:var(--muted);margin-bottom:6px}
  .label-card .value{font-size:60px;font-weight:900}

  .final-wrap{text-align:center;margin-top:22px}
  .final-label{display:inline-block;background:var(--accent);color:#000;padding:10px 18px;border-radius:8px;font-weight:800;font-size:35px}
  .final-score{font-size:250px;font-weight:900;color:var(--accent);margin:-50px 0 14px 0;text-align:center}

  /* 左右侧边栏 */
  .side-panel {
    background: rgba(13, 27, 42, 0.55);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    height: 860px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }

  .side-header {
    border-bottom: 2px solid rgba(244, 201, 78, 0.25);
    padding-bottom: 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .side-title-main {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .side-title-sub {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
  }

  .side-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
  }
  .side-list::-webkit-scrollbar { width: 4px; }
  .side-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .athlete-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .athlete-item.be-ready-highlight {
    border-color: var(--accent);
    background: linear-gradient(90deg, rgba(244, 201, 78, 0.14) 0%, rgba(13, 27, 42, 0.95) 100%);
    box-shadow: 0 4px 16px rgba(244, 201, 78, 0.12);
  }

  .badge-ready {
    background: var(--accent);
    color: #000;
    font-size: 13px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-queue {
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .athlete-names {
    flex: 1;
    min-width: 0;
  }
  .athlete-names .n-eng {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
  }
  .athlete-names .n-chn {
    font-size: 18px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rank-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    font-weight: 900;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rank-1 { background: #f4c94e; color: #000; box-shadow: 0 0 10px rgba(244,201,78,0.4); }
  .rank-2 { background: #d8dee9; color: #000; }
  .rank-3 { background: #d08770; color: #000; }

  .athlete-score {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .empty-tip {
    color: rgba(151, 160, 179, 0.45);
    text-align: center;
    margin-top: 80px;
    font-size: 18px;
  }

  /* 全屏按钮 */
  #fullscreenBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background: rgba(13, 27, 42, 0.85);
    color: var(--accent);
    border: 1px solid rgba(244, 201, 78, 0.4);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.25s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #fullscreenBtn:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  body.is-fullscreen.idle #fullscreenBtn {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="scaleWrap">
    <div class="board-layout">

      <!-- 左栏：Be Ready -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">BE READY</span>
          <span class="side-title-sub">等待出场</span>
        </div>
        <div class="side-list" id="waitingList">
          <div class="empty-tip">正在同步数据...</div>
        </div>
      </div>

      <!-- 中间栏：主看板 -->
      <div class="wrap">
        <div class="project-eng" id="projectEng">—</div>
        <div class="project-chn" id="projectCht">—</div>
        <div class="name-eng" id="nameEng">—</div>
        <div class="name-chn" id="nameCht">—</div>
        <div class="club" id="club">—</div>

        <div class="labels-row" id="labelsRow">
          <div class="label-card">
            <div class="label" id="labelA">A组得分</div>
            <div class="value" id="valA">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelB">B组得分</div>
            <div class="value" id="valB">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelD">纪律扣分</div>
            <div class="value" id="valD">—</div>
          </div>
          <div class="label-card">
            <div class="label" id="labelF">裁判长扣分</div>
            <div class="value" id="valF">—</div>
          </div>
        </div>

        <div class="final-wrap">
          <div class="final-label" id="finalLabel">Final Score 最终得分</div>
        </div>
        <div class="final-score" id="finalScore">—</div>

        <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:6px">
          状态：<span id="updatedAt">正在连接 Google Sheet...</span>
        </div>
      </div>

      <!-- 右栏：已完成排行 -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-title-main">RESULTS</span>
          <span class="side-title-sub">已完成成绩排行</span>
        </div>
        <div class="side-list" id="completedList">
          <div class="empty-tip">正在同步数据...</div>
        </div>
      </div>

    </div>
  </div>

  <button id="fullscreenBtn" onclick="toggleFullScreen()" title="快捷键: F">
    <span>⛶</span> <span id="fsText">全屏 Fullscreen</span>
  </button>

<script>
// 直接通过工作表名称 "score" 绑定，彻底避免 GID 变化导致连接失败
const SPREADSHEET_ID = (window.location.hash.slice(1)) || "1gNxbOq4x3ltS62SC3wgOu3RfQLvPlsmacyR-Sb7Yvxc";
const SHEET_NAME = "score";
const INTERVAL_MS = 3000;
const FIX_BASE_COL = 1; // B列

function safeCell(rows, r, c){
  if (!rows || r < 0 || !rows[r] || !rows[r].c) return null;
  const cell = rows[r].c[c];
  if (!cell) return null;
  if (cell.v !== undefined && cell.v !== null && cell.v !== '') return cell.v;
  if (cell.f !== undefined && cell.f !== null && cell.f !== '') return cell.f;
  return null;
}

function formatScore(v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n.toFixed(2);
}

function escapeHtml(str){
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* 自适应缩放 */
function autoScale() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 960);
  document.getElementById("scaleWrap").style.transform = `scale(${scale})`;
}
autoScale();
window.addEventListener('resize', autoScale);

/* 全屏切换 */
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(e => console.warn(e));
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  document.body.classList.toggle('is-fullscreen', isFs);
  document.getElementById('fsText').innerText = isFs ? '退出全屏 Exit' : '全屏 Fullscreen';
  setTimeout(autoScale, 100);
});
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFullScreen();
});

let idleTimer = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  if (document.fullscreenElement) {
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
});

/* 渲染左右列表 */
function renderSideLists(rows, currentProjCht, currentNameEng, currentAthleteId) {
  const waiting = [];
  const completed = [];

  for (let r = 0; r < rows.length; r++) {
    const athleteId = safeCell(rows, r, 9);    // J列: 号码
    const orderNum  = safeCell(rows, r, 10);   // K列: 出场次序
    const projCht   = safeCell(rows, r, 11);   // L列: 比赛项目
    const nameEng   = safeCell(rows, r, 12);   // M列: 英文姓名
    const nameCht   = safeCell(rows, r, 13);   // N列: 中文姓名
    const rawScore  = safeCell(rows, r, 16);   // Q列: 最终得分
    const confirmed = safeCell(rows, r, 17);   // R列: 裁判确认

    if (!nameEng && !nameCht) continue;
    // 自动跳过表头行
    if (String(projCht || '').includes('比赛项目') || String(athleteId || '').includes('号码') || String(nameEng || '').includes('英文姓名')) {
      continue;
    }

    // 过滤非当前项目的选手
    if (currentProjCht && currentProjCht !== '—' && projCht && String(projCht).trim() !== String(currentProjCht).trim()) {
      continue;
    }

    const isCurrentById = (currentAthleteId !== null && athleteId !== null && String(athleteId).trim() === String(currentAthleteId).trim());
    const isCurrentByName = (currentNameEng && currentNameEng !== '—' && nameEng && String(nameEng).trim() === String(currentNameEng).trim());
    const isCurrent = isCurrentById || isCurrentByName;

    const numScore = Number(rawScore);
    const hasScore = !isNaN(numScore) && numScore > 0;
    const isConfirmed = (confirmed === true || String(confirmed).toUpperCase() === 'TRUE');

    if (isConfirmed || (hasScore && !isCurrent)) {
      completed.push({
        nameEng: nameEng || '—',
        nameCht: nameCht || '—',
        score: isNaN(numScore) ? 0 : numScore,
        scoreText: formatScore(rawScore)
      });
    } else if (!isCurrent) {
      waiting.push({
        orderNum: orderNum,
        nameEng: nameEng || '—',
        nameCht: nameCht || '—'
      });
    }
  }

  const waitingEl = document.getElementById('waitingList');
  if (waiting.length === 0) {
    waitingEl.innerHTML = '<div class="empty-tip">暂无候场选手</div>';
  } else {
    waitingEl.innerHTML = waiting.map((item, idx) => `
      <div class="athlete-item ${idx === 0 ? 'be-ready-highlight' : ''}">
        <span class="${idx === 0 ? 'badge-ready' : 'badge-queue'}">
          ${idx === 0 ? 'BE READY' : '#' + (item.orderNum !== null ? escapeHtml(item.orderNum) : (idx + 1))}
        </span>
        <div class="athlete-names">
          <div class="n-eng">${escapeHtml(item.nameEng)}</div>
          <div class="n-chn">${escapeHtml(item.nameCht)}</div>
        </div>
      </div>
    `).join('');
  }

  completed.sort((a, b) => b.score - a.score);
  const completedEl = document.getElementById('completedList');
  if (completed.length === 0) {
    completedEl.innerHTML = '<div class="empty-tip">暂无完赛成绩</div>';
  } else {
    completedEl.innerHTML = completed.map((item, idx) => {
      const rank = idx + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      return `
        <div class="athlete-item">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <div class="athlete-names">
            <div class="n-eng">${escapeHtml(item.nameEng)}</div>
            <div class="n-chn">${escapeHtml(item.nameCht)}</div>
          </div>
          <div class="athlete-score">${escapeHtml(item.scoreText)}</div>
        </div>
      `;
    }).join('');
  }
}

/* JSONP 回调函数 */
window.handleGvizResponse = function(data) {
  if (!data || data.status === 'error' || !data.table || !data.table.rows) {
    document.getElementById('updatedAt').innerText = '读取异常: ' + (data && data.errors ? data.errors[0].detailed_message : '空表');
    return;
  }

  const rows = data.table.rows;
  const baseCol = FIX_BASE_COL;

  // 智能行偏移检测：如果第 1 行 (rows[0].c[1]) 是空的，而第 2 行 (rows[1].c[1]) 有英文项目名，自动向下偏移 1 行
  let offset = 0;
  if (!safeCell(rows, 0, baseCol) && safeCell(rows, 1, baseCol)) {
    offset = 1;
  }

  const projectEng = safeCell(rows, 0 + offset, baseCol) || '—';
  const projectCht = safeCell(rows, 1 + offset, baseCol) || '—';
  const nameEng    = safeCell(rows, 2 + offset, baseCol) || '—';
  const nameCht    = safeCell(rows, 3 + offset, baseCol) || '—';
  const club       = safeCell(rows, 4 + offset, baseCol) || '—';

  // 查找当前选手编号（通常在 F列 c[5] 对应“选手编号”所在行）
  let currentAthleteId = safeCell(rows, 2 + offset, 5);
  for (let r = 0; r < Math.min(rows.length, 6); r++) {
    if (String(safeCell(rows, r, 6) || '').includes('选手编号')) {
      currentAthleteId = safeCell(rows, r, 5);
      break;
    }
  }

  document.getElementById('projectEng').innerText = projectEng;
  document.getElementById('projectCht').innerText = projectCht;
  document.getElementById('nameEng').innerText = nameEng;
  document.getElementById('nameCht').innerText = nameCht;
  document.getElementById('club').innerText = club;

  document.getElementById('valA').innerText = formatScore(safeCell(rows, 6 + offset, baseCol));
  document.getElementById('valB').innerText = formatScore(safeCell(rows, 6 + offset, baseCol+1));
  document.getElementById('valD').innerText = formatScore(safeCell(rows, 6 + offset, baseCol+2));
  document.getElementById('valF').innerText = formatScore(safeCell(rows, 6 + offset, baseCol+3));
  document.getElementById('finalScore').innerText = formatScore(safeCell(rows, 8 + offset, baseCol));

  renderSideLists(rows, projectCht, nameEng, currentAthleteId);
  document.getElementById('updatedAt').innerText = '已同步 ' + new Date().toLocaleTimeString();
};

function fetchAndRender() {
  const oldScript = document.getElementById('gvizScript');
  if (oldScript) oldScript.remove();

  const script = document.createElement('script');
  script.id = 'gvizScript';
  script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleGvizResponse&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
  script.onerror = function() {
    document.getElementById('updatedAt').innerText = '网络请求被拦截，请检查表格共享权限或网络';
  };
  document.body.appendChild(script);
}

fetchAndRender();
setInterval(fetchAndRender, INTERVAL_MS);
</script>
</body>
</html>
